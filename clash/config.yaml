#---------------------------------------------------#
# Docs: https://wiki.metacubex.one/
#---------------------------------------------------#

### Global

mixed-port: 7890
socks-port: 7891
port: 7892
redir-port: 7894
tproxy-port: 7895
external-controller: 0.0.0.0:9090
# external-ui: /etc/mihomo/ui
# external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
# secret: "<ui_password>"
bind-address: "*"
keep-alive-interval: 15
keep-alive-idle: 600
allow-lan: true
mode: rule
log-level: warning
unified-delay: true
ipv6: false

### TUN — transparent proxy for all host/container/VM traffic
tun:
  enable: true
  stack: mixed
  device: utun
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: true
geodata-auto-update: true
geo-update-interval: 24 # hours
# https://github.com/MetaCubeX/meta-rules-dat/tree/meta/geo/geosite
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

### DNS
dns:
  enable: true
  enhanced-mode: fake-ip # redir-host
  cache-algorithm: arc
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  listen: 0.0.0.0:7874
  ipv6: false
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    # local and test
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "*.localdomain"
    - "*.home.arpa"
    - "*.invalid"
    - "*.test"
    # specific sites
    - "kang.zone"
    - "*.kang.zone"
    - "*.corp.maya.ph"
    - "*voyagerapis.com"
    - "*.goskope.com"
    # connectivity checks (captive portal / network status)
    - "+.msftncsi.com"
    - "www.msftconnecttest.com"
    - "captive.apple.com"
    - "connect.rom.miui.com"
    - "wifi.vivo.com.cn"
    - "connectivitycheck.platform.hicloud.com"
    # tag provider (airport) domains
    - "+.definition-meaning.top"
    - "+.sfr-bouygues.cloud"
    - "+.portail-offres.top"
    # amy provider (airport) node domains
    - "+.xg8vr6d1sx.sbs"
    - "+.juycajfr9d.sbs"
    # lxy provider (airport) node domains
    - "+.lxyun.xyz"
    - "+.777078.xyz"
    - "+.7770008.xyz"
    # NTP
    - "*.time.edu.cn"
    - "*.ntp.org.cn"
    - "time.*"
    - "time.*.*"
    - "ntp.*"
    - "ntp.*.*"
    - "+.pool.ntp.org"
    - "stun.*.*"
    - "stun.*.*.*"
    - "geosite:cn"
  default-nameserver: # 解析 nameserver 和 fallback 中的 DNS 服务器域名
    - 223.5.5.5 # 阿里 DNS
    - 119.29.29.29 # DNSPod
  nameserver: # 处理国内域名和直连流量的解析，通常选择低延迟的本土 DNS
    - https://223.5.5.5/dns-query # 阿里 DoH
    - https://doh.pub/dns-query # 腾讯 DoH
  proxy-server-nameserver: # 解析 proxy 中的节点域名，指向本机 DNS，由 nameserver 与 hosts 处理
    - udp://127.0.0.1:7874
  nameserver-policy: # 替代已弃用的 fallback-filter.geosite；gfw 列表域名只用境外 DNS
    "geosite:cn,apple,category-games@cn,private":
      - 119.29.29.29
      - 223.5.5.5
    # amy provider node domains: resolved by amy's own DoH (token is a secret)
    "+.xg8vr6d1sx.sbs,+.juycajfr9d.sbs":
      - https://iqsjp.com:44443/dns-query/<amy_doh_token>
      - https://blasphemy4985.com:44443/dns-query/<amy_doh_token>
      - https://destitute2725.com:44443/dns-query/<amy_doh_token>
      - https://prolonged3729.com:443/dns-query/<amy_doh_token>

# Node-domain remapping from the amy and tag subscriptions. The entries are
# per-account, so they are generated by scripts/render.sh and never committed.
hosts:
  # <hosts>

sniffer:
  enable: false

proxy-providers:
  amy: # https://www.amytele.net/
    type: http
    url: <proxy_provider_amy_url>
    interval: 3600
    path: "./proxy_provider/amy.yaml"
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
  tag: # https://tagxx.vip
    type: http
    url: <proxy_provider_tag_url>
    interval: 3600
    path: "./proxy_provider/tag.yaml"
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
  lxy: # https://xn--9kqz23b19z.com/#/dashboard
    type: http
    url: <proxy_provider_lxy_url>
    interval: 3600
    path: "./proxy_provider/lxy.yaml"
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

proxy-groups:
  - name: DEFAULT
    type: fallback
    proxies: [DEFAULT-amy, DEFAULT-tag]
    url: http://www.gstatic.com/generate_204
    interval: 600
  - name: TRAFFIC
    type: url-test
    filter: "(香港|日本|台湾|新加坡)高速"
    use: [lxy]
  - name: NETSKOPE
    type: select
    proxies: [DEFAULT-tag, CLEANIP]
  - name: CLEANIP
    type: select
    filter: "(马来西亚家宽|台湾家宽|印尼-棉兰)"
    use: [tag]
  - name: AMERICA
    type: select
    filter: "(美国)"
    use: [tag, amy]
  - name: GAMING
    type: select
    filter: "(香港|台湾)(家宽|游戏)"
    use: [tag]
  - name: DEFAULT-amy
    type: select
    filter: "(新加坡|香港|台湾)"
    use: [amy]
  - name: DEFAULT-tag
    type: select
    filter: "(新加坡|印尼-棉兰|印尼-雅加达|马来西亚家宽)"
    use: [tag]
  - name: 📶 amy
    type: url-test
    use: [amy]
  - name: 📶 tag
    type: url-test
    use: [tag]
  - name: 📶 lxy
    type: url-test
    use: [lxy]

# https://github.com/Loyalsoldier/clash-rules
rule-providers:
  gaming:
    type: http
    url: "https://raw.githubusercontent.com/kangeek/proxy-config/main/clash/rule_provider/gaming.yaml"
    path: "./rule_provider/gaming.yaml"
    behavior: classical
    interval: 86400
  cleanip:
    type: http
    url: "https://raw.githubusercontent.com/kangeek/proxy-config/main/clash/rule_provider/cleanip.yaml"
    path: "./rule_provider/cleanip.yaml"
    behavior: classical
    interval: 86400
  america:
    type: http
    url: "https://raw.githubusercontent.com/kangeek/proxy-config/main/clash/rule_provider/america.yaml"
    path: "./rule_provider/america.yaml"
    behavior: classical
    interval: 86400
  traffic:
    type: http
    url: "https://raw.githubusercontent.com/kangeek/proxy-config/main/clash/rule_provider/traffic.yaml"
    path: "./rule_provider/traffic.yaml"
    behavior: classical
    interval: 86400
  default:
    type: http
    url: "https://raw.githubusercontent.com/kangeek/proxy-config/main/clash/rule_provider/default.yaml"
    path: "./rule_provider/default.yaml"
    behavior: classical
    interval: 86400
  netskope:
    type: http
    url: "https://raw.githubusercontent.com/kangeek/proxy-config/main/clash/rule_provider/netskope.yaml"
    path: "./rule_provider/netskope.yaml"
    behavior: classical
    interval: 86400
  direct:
    type: http
    url: "https://raw.githubusercontent.com/kangeek/proxy-config/main/clash/rule_provider/direct.yaml"
    path: "./rule_provider/direct.yaml"
    behavior: classical
    interval: 86400

# https://github.com/MetaCubeX/meta-rules-dat/tree/meta/geo-lite/geosite
# geosites: https://github.com/v2fly/domain-list-community/tree/master/data
rules:
  # - GEOSITE,category-ads-all,REJECT
  - RULE-SET,cleanip,CLEANIP
  - RULE-SET,traffic,TRAFFIC
  - RULE-SET,america,AMERICA
  - RULE-SET,gaming,GAMING
  - RULE-SET,netskope,NETSKOPE
  - RULE-SET,default,DEFAULT
  - RULE-SET,direct,DIRECT
  - MATCH,DEFAULT
