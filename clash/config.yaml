#---------------------------------------------------#
# Docs: https://wiki.metacubex.one/
#---------------------------------------------------#

### Global

mixed-port: 7890
socks-port: 7891
port: 7892
redir-port: 7894
tproxy-port: 7895
external-controller: 0.0.0.0:9090
# external-ui: /etc/mihomo/ui
# external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
bind-address: "*"
keep-alive-interval: 15
keep-alive-idle: 600
allow-lan: true
mode: rule
log-level: info
ipv6: false

### TUN — transparent proxy for all host/container/VM traffic
tun:
  enable: true
  stack: mixed
  device: utun
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: true
geodata-auto-update: true
geo-update-interval: 24 # hours
# https://github.com/MetaCubeX/meta-rules-dat/tree/meta/geo/geosite
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

### DNS
dns:
  enable: true
  enhanced-mode: redir-host # fake-ip
  cache-algorithm: arc
  use-system-hosts: true
  respect-rules: false
  listen: 0.0.0.0:1053
  ipv6: false
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter: ["kang.zone", "*.kang.zone", "*.siamparagon.org", "*.lan", "*.local", "*.localhost", "*.localdomain", "*.home.arpa", "*.goskope.com", "time.*", "time.*.*", "ntp.*", "ntp.*.*", "+.pool.ntp.org", "stun.*.*", "stun.*.*.*", "geosite:cn"]
  default-nameserver: # 解析 nameserver 和 fallback 中的 DNS 服务器域名
  - 223.5.5.5  # 阿里 DNS
  - 119.29.29.29  # DNSPod
  nameserver: # 处理国内域名和直连流量的解析，通常选择低延迟的本土 DNS
  - 223.5.5.5  # 阿里 DNS
  - 119.29.29.29  # DNSPod
  - https://dns.alidns.com/dns-query # 阿里 DoH
  - https://doh.pub/dns-query # 腾讯 DoH
  nameserver-policy: # 替代已弃用的 fallback-filter.geosite；gfw 列表域名只用境外 DNS
    "geosite:gfw":
      - 8.8.8.8
      - 1.1.1.1
      - tls://8.8.8.8
      - tls://1.1.1.1
  fallback: # 处理国外域名和代理流量的解析，通常选择稳定的 DoH/DoT
  - 8.8.8.8
  - 1.1.1.1
  - tls://8.8.8.8
  - tls://1.1.1.1
  fallback-filter: # 使用 fallback 解析
    geoip: true
    geoip-code: CN # 非中国 IP 采用 fallback 解析结果
    ipcidr:
      - 240.0.0.0/4 # “未来使用”的保留地址
      - 127.0.0.1/32
      - 0.0.0.0/32
    domain:
      - "+.google.com"
      - "+.youtube.com"
sniffer:
  enable: false

proxy-providers:
  amy: # https://www.amytele.net/
    type: http
    url: <proxy_provider_amy_url>
    interval: 3600
    path: "./proxy_provider/amy.yaml"
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
  sntp: # https://u.xn--hwqp2zit2amna.com/dashboards/modern
    type: http
    url: <proxy_provider_sntp_url>
    interval: 3600
    path: "./proxy_provider/sntp.yaml"
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
  tag: # https://tagxx.vip
    type: http
    url: <proxy_provider_tag_url>
    interval: 3600
    path: "./proxy_provider/tag.yaml"
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

proxy-groups:
- name: EASTERN
  type: url-test
  filter: "(台湾|新加坡)"
  use:
  - amy
- name: TRAFFIC
  type: url-test
  use:
  - sntp
- name: NETSKOPE
  type: select
  filter: "1x"
  use:
  - tag
- name: CLEANIP
  type: select
  filter: "家宽"
  use:
  - tag
- name: GAMING
  type: select
  filter: "游戏"
  use:
  - tag

# https://github.com/Loyalsoldier/clash-rules
rule-providers:
  gaming:
    type: http
    url: "https://raw.githubusercontent.com/kangeek/proxy-config/main/clash/rule_provider/gaming.yaml"
    path: "./rule_provider/gaming.yaml"
    behavior: classical
    interval: 86400
  cleanip:
    type: http
    url: "https://raw.githubusercontent.com/kangeek/proxy-config/main/clash/rule_provider/cleanip.yaml"
    path: "./rule_provider/cleanip.yaml"
    behavior: classical
    interval: 86400
  traffic:
    type: http
    url: "https://raw.githubusercontent.com/kangeek/proxy-config/main/clash/rule_provider/traffic.yaml"
    path: "./rule_provider/traffic.yaml"
    behavior: classical
    interval: 86400
  eastern:
    type: http
    url: "https://raw.githubusercontent.com/kangeek/proxy-config/main/clash/rule_provider/eastern.yaml"
    path: "./rule_provider/eastern.yaml"
    behavior: classical
    interval: 86400
  netskope:
    type: http
    url: "https://raw.githubusercontent.com/kangeek/proxy-config/main/clash/rule_provider/netskope.yaml"
    path: "./rule_provider/netskope.yaml"
    behavior: classical
    interval: 86400
  direct:
    type: http
    url: "https://raw.githubusercontent.com/kangeek/proxy-config/main/clash/rule_provider/direct.yaml"
    path: "./rule_provider/direct.yaml"
    behavior: classical
    interval: 86400

# https://github.com/MetaCubeX/meta-rules-dat/tree/meta/geo-lite/geosite
# geosites: https://github.com/v2fly/domain-list-community/tree/master/data
rules:
# - GEOSITE,category-ads-all,REJECT
- RULE-SET,cleanip,CLEANIP
- RULE-SET,gaming,GAMING
- RULE-SET,netskope,NETSKOPE
- RULE-SET,direct,DIRECT
- RULE-SET,traffic,TRAFFIC
- RULE-SET,eastern,EASTERN
- MATCH,EASTERN